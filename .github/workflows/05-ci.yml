name: 05 - ci

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  
jobs:
  ci:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Preparar entorno
        id: setup-uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
        
      - name: Instalar dependencias
        run: uv sync
      
      - name: Test with python ${{ steps.setup-uv.outputs.python_version }}
        run: uv run --frozen pytest