name: 05 - ci

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  
jobs:
  ci:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Preparar entorno
        id: setup-uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
        
      - name: Instalar dependencias
        run: uv sync
      
      - name: Mostrar version Python
        run: uv run python --version
      
      - name: Mostrar carpeta actual y listar directorio
        run: pwd && ls -la
      
      - name: Test with pytest
        run: uv run --frozen pytest
        env:
          PYTHONPATH: .
      
      - name: Formateador/linter with Ruff
        run: uv run ruff check .

      - name: Verificador de tipos with Pyrefly
        run: uv run pyrefly check